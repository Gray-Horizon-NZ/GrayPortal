# Firebase App Hosting build/runtime config. Env vars marked BUILD are
# available during `next build` (needed because Next.js inlines
# NEXT_PUBLIC_* values at build time); RUNTIME vars are available to the
# running server. Secret-backed values are pulled from Secret Manager, set
# via: firebase apphosting:secrets:set <NAME>
runConfig:
  minInstances: 0
  maxInstances: 2

env:
  # Raises the build container's V8 heap limit. Without this, `next build`'s
  # TypeScript type-check step OOMs on the default ~2GB heap once the
  # project's type-inference graph grows past a certain size (build-time
  # only — the running server doesn't need this).
  - variable: NODE_OPTIONS
    value: --max-old-space-size=8192
    availability: [BUILD]

  - variable: DATABASE_URL
    secret: DATABASE_URL
    # BUILD is required too: Next's build step imports every route module
    # (including ones that touch the DB client) to collect page data, and
    # src/lib/db/client.ts throws at import time if this is unset. The
    # Pool() constructor itself doesn't connect eagerly, so this is safe.
    availability: [BUILD, RUNTIME]

  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability: [RUNTIME]

  # Phase 2: Storage-backed document downloads (short-lived signed URLs
  # only — see src/lib/firebase/admin.ts). Runtime only; nothing at build
  # time touches Storage.
  - variable: FIREBASE_STORAGE_BUCKET
    secret: FIREBASE_STORAGE_BUCKET
    availability: [RUNTIME]

  # Phase 3: a separate Google OAuth 2.0 client for Calendar/Tasks sync,
  # NOT the Firebase Auth provider config (src/lib/google/oauth.ts). All
  # runtime-only — the sync adapter is only ever called from a mutation
  # handler, never at build time.
  - variable: GOOGLE_OAUTH_CLIENT_ID
    secret: GOOGLE_OAUTH_CLIENT_ID
    availability: [RUNTIME]

  - variable: GOOGLE_OAUTH_CLIENT_SECRET
    secret: GOOGLE_OAUTH_CLIENT_SECRET
    availability: [RUNTIME]

  - variable: GOOGLE_OAUTH_REDIRECT_URI
    secret: GOOGLE_OAUTH_REDIRECT_URI
    availability: [RUNTIME]

  # Phase 3: pgcrypto symmetric key for the stored Google refresh token
  # (db/sql/005_google_connections.sql). Runtime only.
  - variable: GOOGLE_TOKEN_ENCRYPTION_KEY
    secret: GOOGLE_TOKEN_ENCRYPTION_KEY
    availability: [RUNTIME]

  # Phase 9: Xero OAuth (standard interactive flow, Max's explicit choice
  # over the $10/mo Custom Connection alternative — see
  # src/lib/xero/oauth.ts). Separate client from Firebase Auth and from
  # Phase 3's Google OAuth client, same reasoning as Phase 3's own comment.
  - variable: XERO_OAUTH_CLIENT_ID
    secret: XERO_OAUTH_CLIENT_ID
    availability: [RUNTIME]

  - variable: XERO_OAUTH_CLIENT_SECRET
    secret: XERO_OAUTH_CLIENT_SECRET
    availability: [RUNTIME]

  - variable: XERO_OAUTH_REDIRECT_URI
    secret: XERO_OAUTH_REDIRECT_URI
    availability: [RUNTIME]

  # Phase 9: pgcrypto symmetric key for the stored Xero refresh token
  # (db/sql/011_phase9_xero.sql), separate from GOOGLE_TOKEN_ENCRYPTION_KEY
  # and CREDENTIAL_VAULT_ENCRYPTION_KEY so rotating one never touches
  # another's data.
  - variable: XERO_TOKEN_ENCRYPTION_KEY
    secret: XERO_TOKEN_ENCRYPTION_KEY
    availability: [RUNTIME]

  # Phase 6: pgcrypto symmetric key for stored vault credential secrets
  # (db/sql/006_credentials.sql), separate from GOOGLE_TOKEN_ENCRYPTION_KEY
  # above so rotating one key never touches the other's data. Runtime only.
  - variable: CREDENTIAL_VAULT_ENCRYPTION_KEY
    secret: CREDENTIAL_VAULT_ENCRYPTION_KEY
    availability: [RUNTIME]

  # Phase 11: optional shared-secret header the website's inquiry form
  # script sends on submission — a soft spam deterrent for the public
  # /api/leads intake, not real authentication. If unset, the route skips
  # this check rather than hard-failing before it's configured.
  - variable: LEAD_CAPTURE_SECRET
    secret: LEAD_CAPTURE_SECRET
    availability: [RUNTIME]

  # No FIREBASE_ADMIN_* here on purpose: on App Hosting, the Admin SDK picks
  # up the attached Cloud Run service account automatically via
  # applicationDefault() (see src/lib/firebase/admin.ts) — no key needed in
  # production. The explicit env vars only matter for local dev.

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAdZgbWQ4lZpXln_-v_FILGu9Tok80QbyU
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: grayhorizon-grayportal.firebaseapp.com
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: grayhorizon-grayportal
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:569513179566:web:1979b790fb01e42013b03f"
    availability: [BUILD, RUNTIME]
